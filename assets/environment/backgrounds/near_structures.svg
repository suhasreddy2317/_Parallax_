<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 648" width="1152" height="648">
  <defs>
    <!-- Near Structure Base Gradient -->
    <linearGradient id="nearStructGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#477F91" />
      <stop offset="68%" stop-color="#3D7183" />
      <stop offset="100%" stop-color="#355F70" />
    </linearGradient>

    <!-- Metallic Trim Line -->
    <linearGradient id="metalTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28C7E8" stop-opacity="0.58" />
      <stop offset="50%" stop-color="#B5DCE8" stop-opacity="0.44" />
      <stop offset="100%" stop-color="#28C7E8" stop-opacity="0.52" />
    </linearGradient>
  </defs>

  <!-- Industrial Framework Columns (Pillars reaching down) -->
  <!-- Column 1 (Left Edge - Seamless match at X=0 and X=1152) -->
  <rect x="0" y="320" width="28" height="328" fill="url(#nearStructGrad)" />
  <rect x="1124" y="320" width="28" height="328" fill="url(#nearStructGrad)" />
  <line x1="28" y1="320" x2="28" y2="648" stroke="#315D6C" stroke-width="1.5" />
  <line x1="1124" y1="320" x2="1124" y2="648" stroke="#315D6C" stroke-width="1.5" />

  <!-- Column 2 -->
  <rect x="220" y="260" width="36" height="388" fill="url(#nearStructGrad)" />
  <line x1="220" y1="260" x2="220" y2="648" stroke="#315D6C" stroke-width="1.5" />
  <line x1="256" y1="260" x2="256" y2="648" stroke="#315D6C" stroke-width="1.5" />

  <!-- Column 3 -->
  <rect x="520" y="290" width="42" height="358" fill="url(#nearStructGrad)" />
  <line x1="520" y1="290" x2="520" y2="648" stroke="#315D6C" stroke-width="1.5" />
  <line x1="562" y1="290" x2="562" y2="648" stroke="#315D6C" stroke-width="1.5" />

  <!-- Column 4 -->
  <rect x="820" y="270" width="38" height="378" fill="url(#nearStructGrad)" />
  <line x1="820" y1="270" x2="820" y2="648" stroke="#315D6C" stroke-width="1.5" />
  <line x1="858" y1="270" x2="858" y2="648" stroke="#315D6C" stroke-width="1.5" />

  <!-- Overhead Heavy Industrial Cross-Beam Truss (Y=320 across whole width) -->
  <rect x="0" y="320" width="1152" height="18" fill="url(#nearStructGrad)" stroke="url(#metalTrim)" stroke-width="1.2" />

  <!-- Diagonal Support Trusses between pillars -->
  <g stroke="#3D7183" stroke-width="3.5" opacity="0.88">
    <!-- Span 1 (0 to 220) -->
    <line x1="28" y1="338" x2="220" y2="440" />
    <line x1="220" y1="338" x2="28" y2="440" />

    <!-- Span 2 (256 to 520) -->
    <line x1="256" y1="338" x2="520" y2="460" />
    <line x1="520" y1="338" x2="256" y2="460" />

    <!-- Span 3 (562 to 820) -->
    <line x1="562" y1="338" x2="820" y2="450" />
    <line x1="820" y1="338" x2="562" y2="450" />

    <!-- Span 4 (858 to 1124) -->
    <line x1="858" y1="338" x2="1124" y2="440" />
    <line x1="1124" y1="338" x2="858" y2="440" />
  </g>

  <!-- Large Industrial Ventilation Fan Housing (Bay 2) -->
  <g>
    <circle cx="388" cy="400" r="42" fill="#659EAF" stroke="#315D6C" stroke-width="2.5" />
    <circle cx="388" cy="400" r="14" fill="#B5DCE8" stroke="#00BFEF" stroke-width="1.2" opacity="0.85" />
    <!-- Fan Blades -->
    <path d="M 388 386 L 388 360 Q 402 365 398 388 Z" fill="#477F91" />
    <path d="M 388 414 L 388 440 Q 374 435 378 412 Z" fill="#477F91" />
    <path d="M 402 400 L 428 400 Q 423 414 400 410 Z" fill="#477F91" />
    <path d="M 374 400 L 348 400 Q 353 386 376 390 Z" fill="#477F91" />
  </g>

  <!-- Industrial Coolant Pipe Runs with Glowing Joint Rings -->
  <!-- Top Pipe -->
  <path d="M 0 280 L 1152 280" stroke="#477F91" stroke-width="10" />
  <path d="M 0 280 L 1152 280" stroke="#B5DCE8" stroke-width="2.0" />
  <!-- Pipe Joints -->
  <rect x="216" y="273" width="8" height="14" rx="2" fill="#38bdf8" opacity="0.5" />
  <rect x="516" y="273" width="8" height="14" rx="2" fill="#818cf8" opacity="0.5" />
  <rect x="816" y="273" width="8" height="14" rx="2" fill="#f43f5e" opacity="0.5" />

  <!-- Lower Pipe -->
  <path d="M 0 520 L 1152 520" stroke="#477F91" stroke-width="8" />
  <path d="M 0 520 L 1152 520" stroke="#B5DCE8" stroke-width="1.5" />
</svg>
